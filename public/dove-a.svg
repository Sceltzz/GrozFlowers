<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 175" width="240" height="175" fill="none">
  <defs>
    <linearGradient id="plumeA" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#fbf7f0" />
      <stop offset="1" stop-color="#e3d8c6" />
    </linearGradient>
    <linearGradient id="wingA" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ece2d1" />
    </linearGradient>
    <filter id="softA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2f4635" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#softA)">
    <!-- far wing: swept down and behind the body -->
    <path
      d="M130 110 C126 132 112 150 90 162 C124 154 152 134 164 110 C169 100 162 90 151 93 C140 96 133 102 130 110 Z"
      fill="#e9dece" opacity="0.85" />

    <!-- fan tail -->
    <path
      d="M64 90 C42 86 21 84 2 87 C16 104 39 117 64 119 C60 110 60 99 64 90 Z"
      fill="url(#plumeA)" />
    <path d="M22 90 C36 99 50 106 63 109" stroke="#dbcfbc" stroke-width="1.3" stroke-linecap="round" opacity="0.7" />
    <path d="M14 95 C30 105 46 112 62 115" stroke="#dbcfbc" stroke-width="1.1" stroke-linecap="round" opacity="0.5" />

    <!-- body -->
    <ellipse cx="122" cy="94" rx="64" ry="31" transform="rotate(-9 122 94)" fill="url(#plumeA)" />
    <!-- neck -->
    <path d="M150 70 C160 58 174 53 187 56 C199 59 205 70 201 81 C197 92 184 97 171 93 C159 89 151 81 150 70 Z"
      fill="url(#plumeA)" />
    <!-- head -->
    <circle cx="190" cy="70" r="17" fill="url(#plumeA)" />
    <!-- beak -->
    <path d="M205 66 L222 71 L205 77 Z" fill="#d8c9ae" />
    <circle cx="196" cy="66" r="2.2" fill="#2f4635" opacity="0.8" />

    <!-- near wing: raised, broad -->
    <path
      d="M128 72 C120 47 105 24 84 5 C119 14 150 37 166 68 C172 80 165 91 152 91 C140 91 132 83 128 72 Z"
      fill="url(#wingA)" />
    <path d="M130 74 C124 57 115 41 101 26" stroke="#ddd1be" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
    <path d="M142 80 C137 64 130 50 119 37" stroke="#ddd1be" stroke-width="1.4" stroke-linecap="round" opacity="0.55" />
  </g>
</svg>
