<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 240" width="1440" height="240" fill="none">
  <defs>
    <!--
      Purely decorative this time — nothing here needs to reach full
      opacity or line up with a seam, so the painterly turbulence edge that
      used to fight photographs and viewport heights can just be soft.
    -->
    <filter id="puff" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="4" seed="11" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="60" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="16" />
    </filter>

    <filter id="puffSoft" x="-20%" y="-70%" width="140%" height="240%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.017" numOctaves="3" seed="27" result="n2" />
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="46" xChannelSelector="R" yChannelSelector="G" result="w2" />
      <feGaussianBlur in="w2" stdDeviation="26" />
    </filter>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f0d78e" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#c9a227" stop-opacity="0.2" />
      <stop offset="1" stop-color="#c9a227" stop-opacity="0" />
    </radialGradient>

    <!-- vertical fade: fully transparent at top and bottom, whatever density exists lives in the middle third -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.32" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.68" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="1440" height="240" fill="url(#fade)" />
    </mask>
  </defs>

  <g mask="url(#fadeMask)">
    <ellipse cx="720" cy="120" rx="640" ry="90" fill="url(#glow)" />

    <g filter="url(#puffSoft)" fill="#fdf6e6" opacity="0.4">
      <ellipse cx="140" cy="128" rx="220" ry="46" />
      <ellipse cx="470" cy="108" rx="250" ry="52" />
      <ellipse cx="820" cy="100" rx="270" ry="56" />
      <ellipse cx="1160" cy="116" rx="250" ry="50" />
      <ellipse cx="1420" cy="132" rx="210" ry="44" />
    </g>

    <g filter="url(#puff)" fill="#f4e6bd" opacity="0.5">
      <ellipse cx="60" cy="132" rx="160" ry="38" />
      <ellipse cx="300" cy="120" rx="180" ry="42" />
      <ellipse cx="560" cy="112" rx="190" ry="44" />
      <ellipse cx="820" cy="106" rx="200" ry="46" />
      <ellipse cx="1080" cy="114" rx="190" ry="44" />
      <ellipse cx="1320" cy="124" rx="180" ry="42" />
      <ellipse cx="1500" cy="134" rx="160" ry="38" />
    </g>

    <g filter="url(#puffSoft)" fill="#c9a227" opacity="0.22">
      <ellipse cx="420" cy="118" rx="180" ry="26" />
      <ellipse cx="900" cy="112" rx="200" ry="28" />
      <ellipse cx="1280" cy="122" rx="160" ry="24" />
    </g>
  </g>
</svg>
